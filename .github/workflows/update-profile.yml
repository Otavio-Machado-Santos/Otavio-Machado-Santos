name: Atualiza os cards do perfil

on:
  schedule:
    - cron: "17 * * * *" # de hora em hora; só publica quando os cards mudam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/update-profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publica os cards quando mudam
        run: |
          git add README.md assets
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualiza os cards do perfil"
          git push
